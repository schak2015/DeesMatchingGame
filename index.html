<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f0dc">
    <meta name="description" content="Dee's Matching Game is a cozy farm animal matching game for little learners.">
    <title>Dee's Matching Game</title>
    <style>
      :root {
        color-scheme: light;
        --cream: #f6f0dc;
        --paper: #fffdf5;
        --ink: #354c3c;
        --muted: #71806b;
        --leaf: #6b8f62;
        --leaf-dark: #4b704e;
        --sky: #dcece6;
        --coral: #e58b71;
        --sun: #efc86e;
        --line: #e5dfc9;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 10% 12%, #e4edcf 0, transparent 26rem),
          radial-gradient(ellipse at 92% 78%, #f5dfc8 0, transparent 24rem),
          var(--cream);
      }

      button { font: inherit; }

      .page {
        width: min(100% - 32px, 760px);
        margin: 0 auto;
        padding: 28px 0 38px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--leaf-dark);
        font-size: .86rem;
        font-weight: 800;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .brand-mark { font-size: 1.4rem; }

      .music-button, .restart-button {
        min-height: 44px;
        padding: 9px 15px;
        border: 2px solid #d5ddc8;
        border-radius: 999px;
        color: var(--leaf-dark);
        background: #fffdf5cc;
        font-weight: 700;
        cursor: pointer;
        transition: transform .18s ease, background .18s ease, border-color .18s ease;
      }

      .music-button:hover, .restart-button:hover {
        transform: translateY(-2px);
        border-color: var(--leaf);
        background: white;
      }

      button:focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 3px;
      }

      .intro {
        padding: 28px 0 20px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--leaf);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .17em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 8vw, 4.1rem);
        font-weight: 700;
        letter-spacing: -.055em;
        line-height: 1.08;
      }

      .subtitle {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: clamp(.98rem, 3vw, 1.12rem);
      }

      .how-to-play {
        max-width: 430px;
        margin: 9px auto 0;
        color: var(--muted);
        font-size: .9rem;
        line-height: 1.5;
      }

      .game-panel {
        padding: clamp(16px, 4vw, 28px);
        border: 1px solid #ffffffb8;
        border-radius: 30px;
        background: #fffdf5d9;
        box-shadow: 0 18px 50px #52664217, 0 3px 8px #5266420c;
      }

      .scoreboard {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }

      .score-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 38px;
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #536650;
        background: #fffefa;
        font-size: .92rem;
        font-weight: 700;
      }

      .score-pill strong { color: var(--leaf-dark); }

      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(8px, 2.4vw, 14px);
      }

      .card {
        position: relative;
        display: grid;
        aspect-ratio: 1;
        place-items: center;
        overflow: hidden;
        border: 2px solid #dce4d2;
        border-radius: 20px;
        color: var(--ink);
        background: var(--sky);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
      }

      .card:not(:disabled):hover {
        transform: translateY(-3px) rotate(-1deg);
        border-color: #9ab68b;
        box-shadow: 0 7px 15px #52664217;
      }

      .card-back {
        color: #63805b;
        font-size: clamp(2rem, 8vw, 3.2rem);
        transition: transform .25s ease;
      }

      .card-back::after {
        position: absolute;
        inset: 9px;
        border: 1px dashed #85a27a99;
        border-radius: 13px;
        content: "";
        pointer-events: none;
      }

      .card-face {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }

      .animal {
        font-size: clamp(2.5rem, 10vw, 4.1rem);
        line-height: 1;
        filter: drop-shadow(0 3px 1px #52664216);
      }

      .animal-name {
        color: #52654b;
        font-size: clamp(.7rem, 2.8vw, .87rem);
        font-weight: 800;
      }

      .card.is-face-up {
        border-color: #e3c36f;
        background: #fbf0ce;
        transform: rotate(1deg);
      }

      .card.is-face-up .card-back, .card.is-matched .card-back { display: none; }
      .card.is-face-up .card-face, .card.is-matched .card-face { display: flex; }

      .card.is-matched {
        border-color: #a9c49b;
        background: #e7f0dc;
        cursor: default;
        animation: match-pop .35s ease;
      }

      .card:disabled { opacity: 1; }

      .message {
        min-height: 31px;
        margin: 18px 0 0;
        color: var(--leaf-dark);
        font-size: 1rem;
        font-weight: 700;
        text-align: center;
      }

      .restart-row {
        display: flex;
        justify-content: center;
        margin-top: 8px;
      }

      .restart-button {
        border-color: transparent;
        background: #edf1e4;
      }

      .footer {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        margin-top: 22px;
        color: #78836d;
        font-size: .85rem;
      }

      .footer span { color: var(--coral); }

      .confetti { display: none; }
      .message.is-win { color: #b66a4e; }

      @keyframes match-pop {
        0% { transform: scale(.92); }
        65% { transform: scale(1.06); }
        100% { transform: scale(1); }
      }

      @media (max-width: 440px) {
        .page { width: min(100% - 22px, 760px); padding-top: 18px; }
        .intro { padding-top: 23px; }
        .game-panel { border-radius: 24px; }
        .card { border-radius: 15px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">🌱</span> A little farmyard game</div>
        <button class="music-button" id="music-toggle" type="button" aria-pressed="false">♫ Music off</button>
      </header>

      <section class="intro" aria-labelledby="game-title">
        <p class="eyebrow">A little farmyard fun</p>
        <h1 id="game-title">Dee's Matching Game</h1>
        <p class="subtitle">Can you find all the animal friends?</p>
        <p class="how-to-play">Turn over two cards to find matching animals. Match all 6 pairs to win!</p>
      </section>

      <section class="game-panel" aria-label="Farm animal matching game">
        <div class="scoreboard" aria-label="Game score">
          <div class="score-pill">⭐ Pairs <strong id="pairs-count">0 / 6</strong></div>
          <div class="score-pill">👣 Turns <strong id="turn-count">0</strong></div>
        </div>
        <div class="board" id="game-board" aria-label="Animal cards"></div>
        <p class="message" id="game-message" role="status" aria-live="polite">Pick two cards to find a matching pair!</p>
        <div class="restart-row">
          <button class="restart-button" id="restart-button" type="button">↻ &nbsp;Play again</button>
        </div>
      </section>

      <footer class="footer">Made for curious little minds <span aria-hidden="true">♥</span></footer>
    </main>
  </body>
</html>
